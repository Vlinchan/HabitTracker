name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 
    

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # This must stay at v2!
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # The working-directory tells GitHub to "cd" into your folder first
      - run: flutter pub get
        working-directory: ./HabitFlowAI
      
      - run: flutter build apk --release
        working-directory: ./HabitFlowAI
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: HabitFlowAI/build/app/outputs/flutter-apk/app-release.apk
